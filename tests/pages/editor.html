<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Editor mock</title>
        <style>
            /* Approximates Anki's editor chrome. */
            :root {
                --canvas: #f5f5f5;
                --canvas-elevated: #fff;
                --border: #c4c4c4;
                --fg: #020202;
                --fg-subtle: #737373;
            }
            :root.night-mode {
                --canvas: #2c2c2c;
                --canvas-elevated: #363636;
                --border: #202020;
                --fg: #fcfcfc;
                --fg-subtle: #a1a1a1;
            }
            body {
                margin: 0;
                padding: 12px;
                font-family: system-ui, sans-serif;
                color: var(--fg);
                background: var(--canvas);
            }
            .field-container {
                margin-bottom: 10px;
            }
            .label {
                margin: 0 0 3px 2px;
                font-size: 13px;
                color: var(--fg-subtle);
            }
            .editor-field {
                overflow: hidden;
                border: 1px solid var(--border);
                border-radius: 5px;
            }
            .editing-area {
                display: grid;
            }
            .rich-text-input {
                height: 100%;
                padding: 6px;
                background-color: var(--canvas-elevated);
            }
            .rich-text-relative {
                position: relative;
            }
        </style>
        <script src="/_anki/mock-editor.js"></script>
    </head>
    <body>
        <div class="field-container" data-index="0">
            <div class="label">Front</div>
            <div class="editor-field">
                <div class="editing-area">
                    <div class="rich-text-input">
                        <div class="rich-text-relative">
                            <div class="rich-text-editable"></div>
                            <div class="rich-text-widgets"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="field-container" data-index="1">
            <div class="label">Back</div>
            <div class="editor-field">
                <div class="editing-area">
                    <div class="rich-text-input">
                        <div class="rich-text-relative">
                            <div class="rich-text-editable" data-late="true"></div>
                            <div class="rich-text-widgets"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
